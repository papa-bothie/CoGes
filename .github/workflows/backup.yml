name: Sauvegarde

# Sauvegarde externe chiffrée de la base Neon (ADR 0084). Ici, pas sur le VPS : elle
# continue si le VPS tombe, et aucun accès « lecture de toute la base » n'y est déposé.
#
# Chaque nuit à 02 h 15 UTC (hors des tâches de beat.py qui écrivent beaucoup), et à la
# main. pg_dump → age (clé PUBLIQUE seulement) → stockage objet S3 hors Neon, par rclone,
# avec des clés d'écriture et de liste, sans droit de suppression. Le dump en clair ne
# touche jamais un disque ni un artefact.
#
# pg_dump refuse un serveur d'une version majeure plus récente que lui : le client suit
# la version majeure de la production Neon (PostgreSQL 18), installé depuis le dépôt
# officiel PGDG et figé dans PG_CLIENT_MAJOR ci-dessous, jamais « latest » (ADR 0095).
# Monter la production de version = changer cette variable, celle de ci.yml et l'image
# de docker-compose.yml (un test vérifie qu'elles concordent).
#
# Environnement GitHub `backup`, secrets :
#   BACKUP_DATABASE_URL     DSN de coges_backup (sslmode=require)
#   BACKUP_AGE_RECIPIENT    clé publique age (age1…)
#   BACKUP_S3_ACCESS_KEY_ID / BACKUP_S3_SECRET_ACCESS_KEY   clés d'ÉCRITURE + liste
#   BACKUP_PING_URL         Healthchecks.io (période 1 j, grâce 2 h), facultatif
# variables :
#   BACKUP_S3_PROVIDER      Cloudflare, Other… (rclone)   BACKUP_S3_ENDPOINT, BACKUP_S3_REGION
#   BACKUP_REMOTE_PATH      bucket/préfixe, par ex. coges-sauvegardes/prod

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

env:
  # Version majeure du client PostgreSQL : celle de la production Neon (ADR 0095).
  PG_CLIENT_MAJOR: "18"

jobs:
  backup:
    name: pg_dump chiffré vers le stockage externe
    runs-on: ubuntu-24.04
    environment: backup
    # Secrets de sauvegarde ou de déploiement : jamais depuis une branche quelconque
    # lancée à la main (ADR 0088). Les protections d'environnement GitHub le doublent.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Client PostgreSQL PGDG de la version de PG_CLIENT_MAJOR (Ubuntu 24.04 n'a que le
      # 16) ; le script échoue si pg_dump, pg_restore ou psql répond dans une autre
      # version majeure. Puis age 1.1 et rclone d'Ubuntu.
      - name: Outils
        run: |
          bash deploy/scripts/install_pg_client.sh "$PG_CLIENT_MAJOR"
          sudo apt-get install -y -qq age rclone >/dev/null
          age --version; rclone version | head -1
      - name: Version de pg_dump
        run: |
          pg_dump --version
          major=$(pg_dump --version | sed -nE 's/^pg_dump \(PostgreSQL\) ([0-9]+).*/\1/p')
          [[ "$major" == "$PG_CLIENT_MAJOR" ]] \
            || { echo "::error::pg_dump ${major:-?} au lieu de $PG_CLIENT_MAJOR"; exit 1; }
      - name: Sauvegarde
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_PING_URL: ${{ secrets.BACKUP_PING_URL }}
          BACKUP_REMOTE: coges:${{ vars.BACKUP_REMOTE_PATH }}
          RCLONE_CONFIG: /dev/null
          RCLONE_CONFIG_COGES_TYPE: s3
          RCLONE_CONFIG_COGES_PROVIDER: ${{ vars.BACKUP_S3_PROVIDER }}
          RCLONE_CONFIG_COGES_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          RCLONE_CONFIG_COGES_REGION: ${{ vars.BACKUP_S3_REGION }}
          RCLONE_CONFIG_COGES_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_COGES_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          # Clés sans droit de création de bucket : ne pas essayer.
          RCLONE_S3_NO_CHECK_BUCKET: "true"
        run: bash deploy/scripts/backup.sh
