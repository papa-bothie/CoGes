name: Sur site

# Installation sur site (ADR 0124) : tout CoGes sur un PC, base comprise, sur
# http://localhost. Workflow À PART : « Déployer » rappelle ci.yml en entier avant de
# livrer la production, jamais celui-ci. Son échec bloque la fusion d'une pull request,
# pas un déploiement.
#
# Il ne tourne pas sur `schedule`, ne pousse aucune image et ne lit aucun secret.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onprem:
    name: Sur site (chemins protégés, compose, Caddyfile, démarrage réel, parcours)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Historique complet : la comparaison à la branche de base en a besoin.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      # « Ajouter, ne rien modifier » : sur une branche feat/sur-site-*, aucun fichier du
      # VPS, de l'application, des migrations ni du déploiement ne change. Les autres
      # branches ne sont pas concernées : le développement habituel n'est pas gêné.
      - name: Chemins protégés (branches feat/sur-site-*)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/sur-site-')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 deploy/onprem/check_protected_paths.py --base "origin/$BASE_REF"

      # shellcheck préinstallé sur les runners Ubuntu.
      - run: shellcheck -x deploy/onprem-ci/*.sh

      - name: Caddyfile valide
        run: |
          docker run --rm -v "$PWD/deploy/onprem:/etc/caddy:ro" caddy:2.10.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile \
            || { echo "::error::deploy/onprem/Caddyfile invalide"; exit 1; }

      - name: Compose valide ; le modèle vide est refusé
        run: |
          docker compose --env-file deploy/onprem/coges.env.example \
            -f deploy/onprem/docker-compose.yml --profile tools config --quiet \
            || { echo "::error::deploy/onprem/docker-compose.yml invalide"; exit 1; }
          # Sans les valeurs ci-dessous, le compose doit refuser de démarrer.
          if env -u COGES_IMAGE_TAG -u COGES_APP_PASSWORD docker compose \
              --env-file deploy/onprem/coges.env.example -f deploy/onprem/docker-compose.yml \
              config --quiet 2>/dev/null; then
            echo "::error::le compose démarre avec un modèle vide"; exit 1
          fi
          if python3 deploy/onprem/check_onprem_env.py --env-file deploy/onprem/coges.env.example \
              2>/dev/null; then
            echo "::error::le contrôle accepte un modèle vide"; exit 1
          fi
        env:
          # Le modèle a des valeurs vides : le strict nécessaire à l'interpolation.
          COGES_IMAGE_TAG: ci
          COGES_POSTGRES_PASSWORD: ci
          COGES_OWNER_PASSWORD: ci
          COGES_APP_PASSWORD: ci
          COGES_RELAY_PASSWORD: ci
          COGES_ANALYTICS_PASSWORD: ci
          COGES_PLATFORM_PASSWORD: ci
          COGES_REDIS_PASSWORD: ci
          COGES_JWT_SECRET: ci
          COGES_MFA_ENCRYPTION_KEY: ci

      # Les images de la production, construites par les mêmes Dockerfile et les mêmes
      # contextes que le job `vps` de la CI, dont on relit le cache. Rien n'est poussé.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image front
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: frontend, push: false, load: true, tags: "coges-ci/front:ci", build-args: "NEXT_DEPLOYMENT_ID=ci-${{ github.sha }}", cache-from: "type=gha,scope=front" }
      - name: Image API
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: backend, file: backend/Dockerfile.api, push: false, load: true, tags: "coges-ci/api:ci", cache-from: "type=gha,scope=api" }
      - name: Image worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: backend, file: backend/Dockerfile.worker, push: false, load: true, tags: "coges-ci/worker:ci", cache-from: "type=gha,scope=worker" }

      # Le parcours réutilise le Playwright du front, sans rien y ajouter.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Playwright (Chromium)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      # Le guide docs/runbooks/sur-site.md, joué de bout en bout : réglages, contrôle,
      # migrations (deux fois), démarrage, société, navigateur, tâches planifiées,
      # redémarrage, changement de version, arrêt brutal de PostgreSQL.
      - name: Démarrage réel sur http://localhost
        run: deploy/onprem-ci/verifier.sh
        env:
          ONPREM_REGISTRY: coges-ci
          ONPREM_TAG: ci
          ONPREM_SCREENSHOT: ${{ runner.temp }}/onprem-echec.png

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: onprem-echec
          path: ${{ runner.temp }}/onprem-echec.png
          if-no-files-found: ignore
