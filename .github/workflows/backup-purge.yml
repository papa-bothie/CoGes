name: Sauvegarde — purge

# Rétention des sauvegardes externes (ADR 0084) : 7 quotidiennes, 4 hebdomadaires
# (dimanche), 12 mensuelles (le 1er). Les 7 derniers jours ne sont JAMAIS supprimés.
#
# Compte de stockage DISTINCT de celui qui écrit (environnement `backup-purge`) : un
# workflow de sauvegarde compromis ne peut pas effacer l'historique. Autre solution,
# décrite dans docs/runbooks/sauvegarde.md : une règle de cycle de vie du bucket.
#
# Secrets : BACKUP_PURGE_S3_ACCESS_KEY_ID / BACKUP_PURGE_S3_SECRET_ACCESS_KEY (liste +
# suppression) ; variables : mêmes BACKUP_S3_* et BACKUP_REMOTE_PATH que la sauvegarde.

on:
  schedule:
    - cron: "45 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Lister seulement, ne rien supprimer
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  purge:
    name: Appliquer la rétention
    runs-on: ubuntu-24.04
    environment: backup-purge
    # Secrets de sauvegarde ou de déploiement : jamais depuis une branche quelconque
    # lancée à la main (ADR 0088). Les protections d'environnement GitHub le doublent.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      REMOTE: coges:${{ vars.BACKUP_REMOTE_PATH }}
      DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
      RCLONE_CONFIG: /dev/null
      RCLONE_CONFIG_COGES_TYPE: s3
      RCLONE_CONFIG_COGES_PROVIDER: ${{ vars.BACKUP_S3_PROVIDER }}
      RCLONE_CONFIG_COGES_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      RCLONE_CONFIG_COGES_REGION: ${{ vars.BACKUP_S3_REGION }}
      RCLONE_CONFIG_COGES_ACCESS_KEY_ID: ${{ secrets.BACKUP_PURGE_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_COGES_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_PURGE_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y -qq rclone >/dev/null
      - name: Fichiers hors rétention
        run: |
          rclone lsf --files-only "$REMOTE" > all.txt
          python3 deploy/scripts/backup_retention.py < all.txt > delete.txt
          echo "$(wc -l < all.txt) fichier(s), $(wc -l < delete.txt) à supprimer"
          cat delete.txt
      - name: Suppression
        if: env.DRY_RUN == '0'
        run: |
          while IFS= read -r name; do
            rclone deletefile "$REMOTE/$name"
          done < delete.txt
