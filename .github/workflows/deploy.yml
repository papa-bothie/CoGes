name: Déployer

# CoGes sur le VPS (ADR 0083). Plus de Vercel : images construites ici, poussées sur
# ghcr.io (privé), migrations contre Neon depuis ce job, puis deploy.sh sur le VPS par
# une clé SSH bridée. Rien ne part si la CI n'est pas entièrement verte (décision 07).
#
# Déclencheurs :
#   • à la main (« Run workflow ») : préprod ou production, et la version à déployer ;
#   • un tag vX.Y.Z poussé : préproduction seulement. La production est toujours manuelle.
#
# Environnements GitHub, aux secrets distincts (`preprod`, `production`) :
#   secrets  NEON_OWNER_DSN        DSN de coges_owner, connexion DIRECTE (jamais le pooler) ;
#            DEPLOY_SSH_KEY        clé privée de l'utilisateur `deploy` (bridée sur deploy.sh) ;
#            DEPLOY_KNOWN_HOSTS    empreinte SSH du VPS (ssh-keyscan -p PORT HÔTE) ;
#            SMOKE_SLUG / SMOKE_EMAIL / SMOKE_PASSWORD   compte du test de fumée ;
#   vars     DEPLOY_HOST, DEPLOY_PORT   adresse et port SSH du VPS ;
#            COGES_PUBLIC_URL      https://<domaine> (ou https://preprod.<domaine>).
#
# Sans DEPLOY_SSH_KEY, le job s'arrête après les migrations et affiche la commande à
# lancer sur le VPS : le pipeline marche dans les deux modes.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target:
        description: Environnement cible
        type: choice
        options: [preprod, production]
        default: preprod
      version:
        description: Version à déployer (vX.Y.Z) ; vide = le SHA du commit
        type: string
        required: false

concurrency:
  group: deploy-${{ inputs.target || 'preprod' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/coges

jobs:
  ci:
    name: CI complète
    uses: ./.github/workflows/ci.yml

  images:
    name: Images (ghcr.io)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Historique complet : une version vX.Y.Z se construit depuis son étiquette git,
      # jamais depuis la branche d'où le workflow a été lancé (ADR 0087).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Version et commit
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_SHA::12}"
          fi
          if ! [[ "$version" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?|[0-9a-f]{7,40})$ ]]; then
            echo "::error::version refusée : $version (vX.Y.Z ou SHA)"
            exit 1
          fi
          # Le script de décision vient de ce commit-ci, pas de l'étiquette (qui peut
          # être plus ancienne que lui).
          cp deploy/scripts/registry_cleanup.py deploy/scripts/check_image_imports.sh "$RUNNER_TEMP/"
          if [[ "$version" == v* ]]; then
            if ! sha=$(git rev-parse --verify --quiet "refs/tags/$version^{commit}"); then
              echo "::error::l'étiquette git $version n'existe pas : poussez-la d'abord (git tag $version && git push origin $version)"
              exit 1
            fi
            git checkout --quiet --detach "$sha"
          else
            sha="$GITHUB_SHA"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Version : \`$version\` (commit \`$sha\`)" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Version déjà dans le registre : réutilisée si c'est l'image du même commit
      # (préproduction puis production), refusée sinon (deploy/scripts/registry_cleanup.py).
      - name: Construire, réutiliser ou refuser
        id: decide
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])' 2>/dev/null || true
          }
          for package in front admin api worker bundle; do
            decision=$(python3 "$RUNNER_TEMP/registry_cleanup.py" decide --version "$VERSION" \
              --version-digest "$(digest "$REGISTRY/$package:$VERSION")" \
              --sha-digest "$(digest "$REGISTRY/$package:$SHA")")
            echo "$package : $decision" >> "$GITHUB_STEP_SUMMARY"
            echo "$package=$decision" >> "$GITHUB_OUTPUT"
          done
      # Étiquetées avec la version et le SHA complet du commit. Sans attestation de
      # provenance : chaque image reste un seul manifeste, sans enfant sans étiquette
      # que le nettoyage devrait épargner.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.decide.outputs.front == 'build'
        with:
          context: frontend
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/front:${{ steps.version.outputs.version }},${{ env.REGISTRY }}/front:${{ steps.version.outputs.sha }}
          # Identifiant de build du service worker et de `deploymentId` (ADR 0102).
          build-args: NEXT_DEPLOYMENT_ID=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front
      # Administration de la plateforme (ADR 0089) : image à part, jamais dans le front.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.decide.outputs.admin == 'build'
        with:
          context: frontend-admin
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/admin:${{ steps.version.outputs.version }},${{ env.REGISTRY }}/admin:${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
      # API et worker : construites, lancées, puis poussées. Une image qui n'importe pas son
      # point d'entrée (paquet du seul groupe `dev`, httpx en 3cafc49) n'atteint jamais le
      # registre. Le second build reprend le cache : rien n'est reconstruit.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.decide.outputs.api == 'build'
        with:
          context: backend
          file: backend/Dockerfile.api
          load: true
          tags: coges/api:check
          cache-from: type=gha,scope=api
      - name: L'image API importe app.main
        if: steps.decide.outputs.api == 'build'
        run: bash "$RUNNER_TEMP/check_image_imports.sh" api coges/api:check
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.decide.outputs.worker == 'build'
        with:
          context: backend
          file: backend/Dockerfile.worker
          load: true
          tags: coges/worker:check
          cache-from: type=gha,scope=worker
      - name: L'image worker importe l'application Celery, le relais et la sonde
        if: steps.decide.outputs.worker == 'build'
        run: bash "$RUNNER_TEMP/check_image_imports.sh" worker coges/worker:check
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.decide.outputs.api == 'build'
        with:
          context: backend
          file: backend/Dockerfile.api
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/api:${{ steps.version.outputs.version }},${{ env.REGISTRY }}/api:${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.decide.outputs.worker == 'build'
        with:
          context: backend
          file: backend/Dockerfile.worker
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/worker:${{ steps.version.outputs.version }},${{ env.REGISTRY }}/worker:${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.decide.outputs.bundle == 'build'
        with:
          context: .
          file: deploy/vps/Dockerfile.bundle
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/bundle:${{ steps.version.outputs.version }},${{ env.REGISTRY }}/bundle:${{ steps.version.outputs.sha }}

  migrate:
    name: Migrations (Neon, coges_owner)
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'preprod' }}
    # Secrets de sauvegarde ou de déploiement : jamais depuis une branche quelconque
    # lancée à la main (ADR 0088). Les protections d'environnement GitHub le doublent.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      # Garde-fou 2 (ADR 0042) : aucun DSN propriétaire dans les fichiers d'exécution.
      - run: python3 deploy/scripts/check_runtime_env.py
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { enable-cache: true }
      # Règle (ADR 0083) : une migration reste compatible avec la version précédente du
      # code (on ajoute d'abord, on supprime à la version suivante). Revenir en arrière ne
      # touche donc jamais la base.
      - name: alembic upgrade head
        env:
          COGES_ENV: ${{ inputs.target == 'production' && 'production' || 'staging' }}
          # Le seul endroit où ce DSN existe (ADR 0042) : jamais sur le VPS.
          COGES_DATABASE_URL_OWNER: ${{ secrets.NEON_OWNER_DSN }}
          # Requis par la configuration, jamais utilisé par Alembic.
          COGES_DATABASE_URL_APP: postgresql+psycopg://unused@localhost/unused
        run: |
          # Requis par la configuration hors local/CI (ADR 0087), jamais utilisé par
          # Alembic : un secret jetable, tiré pour ce seul job.
          COGES_JWT_SECRET="$(openssl rand -hex 32)"
          export COGES_JWT_SECRET
          uv sync --directory backend --frozen --no-dev --no-group ml
          uv run --directory backend --no-sync alembic upgrade head

  deploy:
    name: VPS (deploy.sh, test de fumée)
    needs: [images, migrate]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'preprod' }}
    # Secrets de sauvegarde ou de déploiement : jamais depuis une branche quelconque
    # lancée à la main (ADR 0088). Les protections d'environnement GitHub le doublent.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    env:
      TARGET: ${{ inputs.target || 'preprod' }}
      VERSION: ${{ needs.images.outputs.version }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/checkout@v5

      - name: Sans clé de déploiement — commande à lancer sur le VPS
        if: env.DEPLOY_SSH_KEY == ''
        run: |
          {
            echo "### Déploiement à finir à la main"
            echo "Images poussées et migrations jouées. Sur le VPS :"
            echo '```'
            echo "sudo -u deploy /opt/coges/deploy.sh $TARGET $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Aucune clé DEPLOY_SSH_KEY : lancer « deploy.sh $TARGET $VERSION » sur le VPS."

      - name: Clé SSH bridée
        if: env.DEPLOY_SSH_KEY != ''
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Empreinte connue d'avance : jamais d'acceptation aveugle d'un hôte inconnu.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: deploy.sh sur le VPS (vérification et retour automatique compris)
        if: env.DEPLOY_SSH_KEY != ''
        # La clé ne peut lancer que /opt/coges/deploy.sh : ce texte devient ses arguments.
        run: ssh -i ~/.ssh/deploy -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$DEPLOY_HOST" "$TARGET $VERSION"

      - name: Test de fumée
        id: smoke
        if: env.DEPLOY_SSH_KEY != ''
        env:
          COGES_SMOKE_URL: ${{ vars.COGES_PUBLIC_URL }}
          COGES_SMOKE_SLUG: ${{ secrets.SMOKE_SLUG }}
          COGES_SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          COGES_SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python3 deploy/scripts/smoke.py

      # Les deux images que le nettoyage ne supprime jamais (ADR 0087) : celle qui tourne
      # et la précédente, dont dépendent `deploy.sh rollback` et la reconstruction du VPS.
      - name: Étiquettes production et production-previous
        if: env.TARGET == 'production' && env.DEPLOY_SSH_KEY != ''
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])' 2>/dev/null || true
          }
          for package in front admin api worker bundle; do
            image="$REGISTRY/$package"
            current=$(digest "$image:production")
            if [ -n "$current" ] && [ "$current" != "$(digest "$image:$VERSION")" ]; then
              docker buildx imagetools create --tag "$image:production-previous" "$image:production"
            fi
            docker buildx imagetools create --tag "$image:production" "$image:$VERSION"
          done
          docker logout ghcr.io

      - name: Retour à la version précédente
        if: failure() && steps.smoke.conclusion == 'failure'
        run: ssh -i ~/.ssh/deploy -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$DEPLOY_HOST" "$TARGET rollback"

      - name: Nettoyage de la clé
        if: always()
        run: rm -f ~/.ssh/deploy

  cleanup:
    name: Registre — production, précédente et la dernière préproduction
    needs: [images, deploy]
    if: always() && needs.images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [front, admin, api, worker, bundle]
    steps:
      - uses: actions/checkout@v5
      # Quota gratuit de 500 Mo (ADR 0087) : jamais `production` ni
      # `production-previous`, jamais une version sans étiquette, et la dernière
      # préproduction ; tout le reste part (deploy/scripts/registry_cleanup.py).
      - name: Versions à supprimer
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ids=$(gh api --paginate "/users/$OWNER/packages/container/coges%2F${{ matrix.package }}/versions" \
            | python3 deploy/scripts/registry_cleanup.py plan)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.package }} : ${ids:-rien} à supprimer" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/delete-package-versions@v5
        if: steps.plan.outputs.ids != ''
        with:
          package-name: coges/${{ matrix.package }}
          package-type: container
          package-version-ids: ${{ steps.plan.outputs.ids }}
