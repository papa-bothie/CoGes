name: CI

# Bloquante (décision 07) : le workflow « Déploiement » ne part que si **tous** ces
# jobs sont verts sur `main`. Une fuite inter-tenant arrête donc le déploiement.

on:
  # Toutes les branches, `main` compris : le déploiement ne part plus à chaque push sur
  # `main` (ADR 0083), il rappelle la CI quand on le lance (tag vX.Y.Z ou à la main).
  push:
  pull_request:
  workflow_call:
  # Analyses de sécurité chaque lundi (ADR 0080) : une faille publiée depuis le dernier
  # push doit se voir sans attendre le suivant. Seul le job `security` tourne alors.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Lecture seule par défaut (ADR 0088) : aucun job de la CI n'écrit dans le dépôt.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mots de passe de CI, éphémères et sans valeur hors du runner.
  PGPASSWORD: ci-postgres
  POSTGRES_PASSWORD: ci-postgres
  COGES_OWNER_PASSWORD: ci-owner
  COGES_APP_PASSWORD: ci-app
  COGES_RELAY_PASSWORD: ci-relay
  COGES_ANALYTICS_PASSWORD: ci-analytics
  # Rôle de la sauvegarde externe (ADR 0084), créé par 01-roles.sql.
  COGES_BACKUP_PASSWORD: ci-backup
  # Administration de la plateforme (ADR 0089), créé par 01-roles.sql.
  COGES_PLATFORM_PASSWORD: ci-platform
  COGES_ENV: ci
  COGES_DATABASE_URL_OWNER: postgresql+psycopg://coges_owner:ci-owner@localhost:5432/coges
  COGES_DATABASE_URL_APP: postgresql+psycopg://coges_app:ci-app@localhost:5432/coges
  COGES_DATABASE_URL_RELAY: postgresql+psycopg://coges_relay:ci-relay@localhost:5432/coges
  COGES_DATABASE_URL_ANALYTICS: postgresql+psycopg://coges_analytics:ci-analytics@localhost:5432/coges
  COGES_DATABASE_URL_PLATFORM: postgresql+psycopg://coges_app_platform:ci-platform@localhost:5432/coges
  COGES_TEST_DATABASE_URL_OWNER: postgresql+psycopg://coges_owner:ci-owner@localhost:5432/coges_test
  COGES_TEST_DATABASE_URL_APP: postgresql+psycopg://coges_app:ci-app@localhost:5432/coges_test
  COGES_TEST_DATABASE_URL_RELAY: postgresql+psycopg://coges_relay:ci-relay@localhost:5432/coges_test
  COGES_TEST_DATABASE_URL_ANALYTICS: postgresql+psycopg://coges_analytics:ci-analytics@localhost:5432/coges_test
  COGES_TEST_DATABASE_URL_PLATFORM: postgresql+psycopg://coges_app_platform:ci-platform@localhost:5432/coges_test
  COGES_JWT_SECRET: ci-jwt-secret-0000000000000000000000
  COGES_REDIS_URL: redis://localhost:6379/0
  # Les quarante tests d'intégrité du § 10, sélectionnés par leur numéro.
  INTEGRITY_TESTS: >-
    test_t01 or test_t02 or test_t03 or test_t04 or test_t05 or test_t06 or test_t07 or
    test_t08 or test_t09 or test_t10 or test_t11 or test_t12 or test_t13 or test_t14 or
    test_t15 or test_t16 or test_t17 or test_t18 or test_t19 or test_t20 or test_t21 or
    test_t22 or test_t23 or test_t24 or test_t25 or test_t26 or test_t27 or test_t28 or
    test_t29 or test_t30 or test_t31 or test_t32 or test_t33 or test_t34 or test_t35 or
    test_t36 or test_t37 or test_t38 or test_t39 or test_t40

jobs:
  security:
    name: Sécurité (gitleaks, pip-audit, pnpm audit)
    runs-on: ubuntu-latest
    steps:
      # Tout l'historique : un secret effacé d'un fichier reste dans un ancien commit.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { enable-cache: true }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { package_json_file: frontend/package.json }
      # Sans `cache: pnpm` : `pnpm audit` lit le lockfile sans rien installer, et un
      # magasin pnpm absent fait échouer le nettoyage de fin de job.
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/coges
          key: gitleaks-${{ runner.os }}-8.30.1
      - run: make security-scan

  lint:
    name: Lint (ruff + mypy --strict)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { enable-cache: true }
      - run: uv sync --directory backend --frozen
      - run: make lint

  generated:
    name: Fichiers générés à jour (OpenAPI, requirements Vercel)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { enable-cache: true }
      - run: uv sync --directory backend --frozen
      # Le contrat OpenAPI versionné est la source des types du frontend.
      - run: make check-generated
      # Garde-fou 2 (ADR 0042) : aucun DSN propriétaire dans les compose du VPS et du poste.
      - run: python3 deploy/scripts/check_runtime_env.py

  vps:
    name: VPS (shellcheck, Caddyfile, compose, images sans push)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # shellcheck préinstallé sur les runners Ubuntu.
      - run: shellcheck -x deploy/vps/*.sh deploy/scripts/*.sh frontend/static-entrypoint.sh
      - name: Caddyfile valide (les trois portes de l'administration, ADR 0104)
        run: |
          for gate in cloudflare ip ssh; do
            docker run --rm -e COGES_DOMAIN=coges.example.sn -e COGES_ACME_EMAIL=ops@example.sn \
              -e COGES_ADMIN_GATE="$gate" -e COGES_ADMIN_ALLOWED_IPS="192.0.2.10 2001:db8::/48" \
              -e COGES_ADMIN_TUNNEL_IPS="0.0.0.0/0 ::/0" \
              -v "$PWD/deploy/vps:/etc/caddy:ro" caddy:2.10.2-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile \
              || { echo "::error::Caddyfile invalide (porte $gate)"; exit 1; }
          done
      - name: Compose valide
        run: |
          docker network create --subnet 172.30.0.0/24 coges_edge
          COGES_IMAGE_TAG=ci docker compose -p coges -f deploy/vps/docker-compose.yml \
            --env-file deploy/vps/coges.env.example --profile edge --profile tunnel config --quiet \
            || { echo "::error::deploy/vps/docker-compose.yml invalide"; exit 1; }
        env:
          # Le modèle a des valeurs vides : on fournit le strict nécessaire à l'interpolation.
          COGES_DOMAIN: coges.example.sn
          COGES_ACME_EMAIL: ops@example.sn
          COGES_DATABASE_URL_APP: postgresql+psycopg://coges_app:x@ep.neon.tech/coges?sslmode=require
          COGES_DATABASE_URL_RELAY: postgresql+psycopg://coges_relay:x@ep.neon.tech/coges?sslmode=require
          COGES_DATABASE_URL_ANALYTICS: postgresql+psycopg://coges_analytics:x@ep.neon.tech/coges?sslmode=require
          COGES_DATABASE_URL_PLATFORM: postgresql+psycopg://coges_app_platform:x@ep.neon.tech/coges?sslmode=require
          COGES_REDIS_PASSWORD: ci-redis
          COGES_JWT_SECRET: ci-jwt-secret-0000000000000000000000
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Les quatre images du VPS se construisent : un Dockerfile cassé se voit sur la PR,
      # pas le jour du déploiement. Rien n'est poussé ici.
      - name: Image front
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        # Identifiant obligatoire (ADR 0103, P4) : celui de la CI, jamais poussé.
        with: { context: frontend, push: false, build-args: "NEXT_DEPLOYMENT_ID=ci-${{ github.sha }}", cache-from: "type=gha,scope=front", cache-to: "type=gha,mode=max,scope=front" }
      - name: Image administration
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: frontend-admin, push: false, cache-from: "type=gha,scope=admin", cache-to: "type=gha,mode=max,scope=admin" }
      # `load` : l'image est gardée dans Docker pour être lancée juste après.
      - name: Image API
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: backend, file: backend/Dockerfile.api, push: false, load: true, tags: "coges/api:ci", cache-from: "type=gha,scope=api", cache-to: "type=gha,mode=max,scope=api" }
      - name: Image worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: backend, file: backend/Dockerfile.worker, push: false, load: true, tags: "coges/worker:ci", cache-from: "type=gha,scope=worker", cache-to: "type=gha,mode=max,scope=worker" }
      # Chaque image importe son point d'entrée : un paquet du seul groupe `dev` importé
      # par app/ (httpx, 3cafc49) cassait la production au démarrage, tests verts.
      - name: Les images API et worker importent leur point d'entrée
        run: |
          deploy/scripts/check_image_imports.sh api coges/api:ci
          deploy/scripts/check_image_imports.sh worker coges/worker:ci
      - name: Bundle de déploiement
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: ., file: deploy/vps/Dockerfile.bundle, push: false }

  frontend:
    name: ${{ matrix.project }} (types, lint, typecheck, Vitest, build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Le front commerçant et l'administration de la plateforme (ADR 0089).
        project: [frontend, frontend-admin]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { package_json_file: "${{ matrix.project }}/package.json" }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Les types du client sont générés depuis backend/openapi.json : jamais à la main.
      - run: pnpm check:api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          COGES_API_URL: http://localhost:8000

  database:
    name: ${{ matrix.suite.name }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Version majeure de PostgreSQL : celle de la production Neon (ADR 0095). Seule
        # source de vérité du fichier, reprise par le service et par le client installé.
        # `env` n'est pas lisible dans `services`, la matrice l'est.
        postgres: ["18"]
        suite:
          - name: Tests d'intégrité T1–T40
            id: integrity
          - name: Tests de fuite inter-tenant
            id: tenancy
          - name: Tests unitaires, intégration et architecture
            id: suite
          - name: Migrations réversibles
            id: migrations
          - name: Latence du tableau de bord
            id: perf
          - name: "Sauvegarde : chaîne complète"
            id: backup

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # pg_dump refuse un serveur plus récent que lui : le client 16 du runner ne
      # sauvegarde pas un PostgreSQL 18. Installé avant l'amorçage, qui l'utilise aussi.
      - name: Client PostgreSQL ${{ matrix.postgres }} (PGDG)
        if: matrix.suite.id == 'backup'
        run: bash deploy/scripts/install_pg_client.sh "${{ matrix.postgres }}"

      - name: Amorcer les rôles et les bases
        # Même script qu'en local et que sur Neon (README-infra).
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres
             -f deploy/postgres/init/01-roles.sql

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { enable-cache: true }
      - run: uv sync --directory backend --frozen

      - name: T1–T40 (§ 10 du Modèle), avec le tableau récapitulatif
        if: matrix.suite.id == 'integrity'
        run: |
          uv run --directory backend pytest -k "$INTEGRITY_TESTS" --junitxml=integrity.xml
          python3 deploy/scripts/integrity_summary.py backend/integrity.xml

      # Bloquant : une fuite inter-tenant arrête le déploiement (décision 07).
      - name: Tests de fuite inter-tenant
        if: matrix.suite.id == 'tenancy'
        run: make test-tenancy

      - name: Le reste de la suite (unitaires, intégration, architecture)
        if: matrix.suite.id == 'suite'
        run: uv run --directory backend pytest --ignore=tests/tenancy -k "not ($INTEGRITY_TESTS)"

      - name: upgrade head → downgrade -1 → upgrade head, puis downgrade base → upgrade head
        if: matrix.suite.id == 'migrations'
        run: |
          make migrate
          uv run --directory backend alembic downgrade -1
          make migrate
          uv run --directory backend alembic downgrade base
          make migrate

      # ADR 0084 : sauvegarde chiffrée (rôle coges_backup) → faux stockage → restauration
      # dans une base vide → verify_restore.py. Aucun envoi réel.
      - name: "Sauvegarde : dump chiffré, restauration, vérification"
        if: matrix.suite.id == 'backup'
        env:
          BACKUP_SOURCE_URL: postgresql://coges_backup:ci-backup@localhost:5432/coges
          RESTORE_ADMIN_URL: postgresql://postgres:ci-postgres@localhost:5432/postgres
        run: |
          sudo apt-get install -y -qq age rclone >/dev/null
          make migrate
          make seed-demo
          bash deploy/scripts/backup_chain_check.sh

      # La cible « moins de 200 ms » de la phase 08, sur le jeu de `make seed-demo`.
      - name: Latence du tableau de bord
        if: matrix.suite.id == 'perf'
        run: make test-perf
