<!doctype html>
<html lang="fr"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
<meta charset="utf-8">
<title>CoGes — Connexion</title>
<style>x-dc{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com" data-dc-tpl="1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" data-dc-tpl="2"><style data-dc-tpl="3">
body{margin:0;background:#FBF8F3;color:#1E2320;font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.45}
a{color:#024A2C}a:hover{color:#04432D}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lbl{display:block;font-weight:700;font-size:17px;margin-bottom:8px}
.in{width:100%;box-sizing:border-box;min-height:60px;border-radius:16px;border:2px solid #E3DCD0;padding:0 16px;font:inherit;font-size:19px;background:#fff;color:#1E2320}
.in:focus{outline:3px solid #9BD3B6;border-color:#117A3C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:0 22px;border-radius:18px;border:0;font:inherit;font-weight:800;font-size:20px;cursor:pointer}
</style></head>
<body>
<div id="dc-root"><div class="sc-host" data-sc-name="Connexion"><div data-dc-tpl="4" style="min-height: 900px; display: flex; flex-wrap: wrap;">
  <section data-dc-tpl="5" style="flex: 1 1 380px; background: rgb(232, 245, 236); color: rgb(2, 74, 44); padding: 56px 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; box-sizing: border-box;">
    <img data-dc-tpl="6" src="../logo/coges-logo.png" alt="CoGes, votre entreprise sous contrôle" style="width: 320px; max-width: 100%; height: auto;">
    <div data-dc-tpl="7">
      <div data-dc-tpl="8" style="font-size: 44px; font-weight: 800; line-height: 1.1; max-width: 440px;">Votre boutique, simplement.</div>
      <div data-dc-tpl="9" style="font-size: 20px; margin-top: 16px; max-width: 420px; color: rgb(36, 84, 59);">Vendre, suivre le stock et savoir ce que vous gagnez, chaque jour.</div>
    </div>
    <div data-dc-tpl="10" style="display: flex; flex-wrap: wrap; gap: 10px;">
      <span data-dc-tpl="11" style="padding: 10px 16px; border-radius: 999px; background: rgb(255, 255, 255); color: rgb(2, 74, 44); font-weight: 700;">Ventes</span>
      <span data-dc-tpl="12" style="padding: 10px 16px; border-radius: 999px; background: rgb(255, 255, 255); color: rgb(2, 74, 44); font-weight: 700;">Stock</span>
      <span data-dc-tpl="13" style="padding: 10px 16px; border-radius: 999px; background: rgb(255, 255, 255); color: rgb(2, 74, 44); font-weight: 700;">Dettes</span>
      <span data-dc-tpl="14" style="padding: 10px 16px; border-radius: 999px; background: rgb(255, 255, 255); color: rgb(2, 74, 44); font-weight: 700;">Argent</span>
    </div>
  </section>

  <section data-dc-tpl="15" style="flex: 1 1 440px; display: flex; align-items: center; justify-content: center; padding: 48px 24px; box-sizing: border-box;">
    <form data-dc-tpl="16" style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px;">
      <h1 data-dc-tpl="17" style="font-size: 32px; margin: 0px; font-weight: 800;">Se connecter</h1>

      <div data-dc-tpl="20">
        <label data-dc-tpl="21" class="lbl" for="shop">Code de la boutique</label>
        <input data-dc-tpl="22" id="shop" class="in" autocomplete="organization" value="keur-fatou" style="">
      </div>
      <div data-dc-tpl="23">
        <label data-dc-tpl="24" class="lbl" for="mail">Votre e-mail</label>
        <input data-dc-tpl="25" id="mail" class="in" inputmode="email" autocomplete="username" value="fatou@keurfatou.sn" style="">
      </div>
      <div data-dc-tpl="26">
        <label data-dc-tpl="27" class="lbl" for="pw">Mot de passe</label>
        <div data-dc-tpl="28" style="position: relative;">
          <input data-dc-tpl="29" id="pw" class="in" type="password" autocomplete="current-password" value="motdepasse" style="padding-right: 120px;">
          <button data-dc-tpl="30" type="button" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); min-height: 48px; padding: 0px 14px; border-radius: 12px; border: 0px; background: rgb(243, 238, 229); font-style: inherit; font-variant: inherit; font-stretch: inherit; font-size: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-weight: 700; cursor: pointer;"><span class="sc-interp">Afficher</span></button>
        </div>
      </div>
      <button data-dc-tpl="31" type="button" class="btn" style="background: rgb(17, 122, 60); color: rgb(255, 255, 255); width: 100%;">Entrer</button>
      <div data-dc-tpl="32" style="color: rgb(60, 68, 64); font-size: 17px;">Mot de passe oublié ? Demandez à votre gérant : il peut vous en créer un nouveau.</div>
      <a data-dc-tpl="33" href="#Main" style="font-weight: 700; font-size: 17px; min-height: 44px; display: inline-flex; align-items: center;">Voir l'accueil de la démo</a>
    </form>
  </section></div></div></div>



</body></html>
