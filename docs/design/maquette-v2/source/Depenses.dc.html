<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CoGes — Dépenses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FBF8F3;color:#1E2320;font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.45}
a{color:#117A3C}a:hover{color:#024A2C}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 24px;background:#FFFFFF;border-bottom:1px solid #ECE6DC}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:44px;height:44px;border-radius:14px;background:#117A3C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;text-decoration:none;color:#3C4440;font-weight:600;font-size:16px}
.tab:hover{background:#F3EEE5;color:#1E2320}
.tab.on{background:#EAF1FD;color:#1747AE}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:24px 24px 48px;box-sizing:border-box}
.card{background:#fff;border-radius:22px;border:1px solid #ECE6DC;padding:22px;box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;font:inherit;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:#5B625E}
h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-0.01em}
h2{font-size:20px;margin:0;font-weight:700}
.lbl{font-weight:700;font-size:17px;margin-bottom:10px;display:block}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;border-radius:18px;border:2px solid #E3DCD0;background:#fff;font:inherit;font-weight:700;font-size:15px;color:#1E2320;cursor:pointer;padding:8px;text-align:center}
.cat.on{border-color:#A51D24;background:#FDECEC;color:#A51D24}
.chip{min-height:50px;padding:0 18px;border-radius:999px;border:2px solid #E3DCD0;background:#fff;font:inherit;font-weight:700;font-size:16px;color:#1E2320;cursor:pointer}
.chip.on{border-color:#A51D24;background:#FDECEC;color:#A51D24}
input.amount{width:100%;box-sizing:border-box;min-height:64px;border-radius:16px;border:2px solid #E3DCD0;padding:0 48px 0 18px;font:inherit;font-size:28px;font-weight:800;background:#fff;color:#1E2320}
input.amount:focus{outline:3px solid #F3C9CB;border-color:#A51D24}
.key{min-height:52px;border-radius:14px;border:2px solid #E3DCD0;background:#fff;font:inherit;font-size:21px;font-weight:700;color:#1E2320;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #F0EBE2}
</style>
</helmet>
<div>
  <nav class="nav" aria-label="Menu principal">
    <div class="brand">
      <img src="../logo/coges-mark.png" alt="" style="width:40px;height:43px;flex:none">
      <div><img src="../logo/coges-wordmark.png" alt="CoGes" style="height:24px;width:102px;display:block"><div class="muted" style="font-size:15px">Alimentation Keur Fatou</div></div>
    </div>
    <div class="tabs">
      <a class="tab" href="Main.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
      <a class="tab" href="Vente.dc.html"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"></path></svg>Vendre</a>
      <a class="tab" href="Articles.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>Stock</a>
      <a class="tab" href="Clients.dc.html"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"></path></svg>Clients</a>
      <a class="tab on" href="Finance.dc.html"><svg class="ico" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="3"></rect><path d="M2 10h20M16 15h2"></path></svg>Argent</a>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <a class="tab" href="Conseils.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"></path></svg>Conseils</a>
      <a class="tab" href="Alertes.dc.html" aria-label="Alertes, 3 non lues" style="position:relative;padding:0 12px"><svg class="ico" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg><span style="position:absolute;top:4px;right:2px;min-width:20px;height:20px;border-radius:999px;background:#C2410C;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center">3</span></a>
      <a class="tab" href="Reglages.dc.html" aria-label="Réglages" style="padding:0 12px"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg></a>
    </div>
  </nav>

  <main class="wrap" style="display:flex;flex-direction:column;gap:20px">
    <div>
      <h1>Dépenses</h1>
      <div class="muted" style="font-size:18px">Ce mois-ci : <span class="num" style="font-weight:800;color:#A51D24">{{monthTxt}} F</span></div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
      <section class="card" style="flex:3 1 460px;min-width:0;display:flex;flex-direction:column;gap:16px">
        <h2>Nouvelle dépense</h2>
        <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
          <div style="padding:14px 16px;border-radius:16px;background:#E6F4EC;color:#024A2C;font-weight:700">{{savedTxt}}</div>
        </sc-if>
        <div>
          <span class="lbl">Pour quoi ?</span>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">
            <sc-for list="{{cats}}" as="c" hint-placeholder-count="9">
              <button type="button" class="cat {{c.cls}}" onClick="{{c.pick}}">
                <svg class="ico" viewBox="0 0 24 24" style="width:28px;height:28px"><path d="{{c.icon}}"></path></svg>{{c.label}}
              </button>
            </sc-for>
          </div>
        </div>
        <div>
          <label for="amt" class="lbl">Combien ?</label>
          <div style="position:relative">
            <input id="amt" class="amount num" inputmode="numeric" value="{{amountTxt}}" onChange="{{onAmount}}" placeholder="Tapez le montant">
            <span style="position:absolute;right:18px;top:50%;transform:translateY(-50%);font-weight:800;font-size:22px;color:#5B625E">F</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;max-width:420px">
            <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
              <button type="button" class="key" onClick="{{k.press}}" aria-label="{{k.aria}}">{{k.label}}</button>
            </sc-for>
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:20px">
          <div style="flex:1 1 240px">
            <span class="lbl">Quand ?</span>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
              <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
                <button type="button" class="chip {{d.cls}}" onClick="{{d.pick}}">{{d.label}}</button>
              </sc-for>
            </div>
          </div>
          <div style="flex:1 1 240px">
            <span class="lbl">Payé avec</span>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
              <sc-for list="{{methods}}" as="m" hint-placeholder-count="3">
                <button type="button" class="chip {{m.cls}}" onClick="{{m.pick}}">{{m.label}}</button>
              </sc-for>
            </div>
          </div>
        </div>
        <button type="button" class="btn" onClick="{{save}}" disabled="{{blocked}}" style="width:100%;min-height:66px;font-size:20px;background:{{cta}};color:#fff">Enregistrer la dépense</button>
      </section>

      <section class="card" style="flex:2 1 340px;min-width:0">
        <h2>Ce mois-ci, par type</h2>
        <div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">
          <sc-for list="{{byCat}}" as="b" hint-placeholder-count="5">
            <div>
              <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:700">{{b.label}}</span><span class="num" style="font-weight:800">{{b.totalTxt}} F</span></div>
              <div style="height:12px;border-radius:999px;background:#F6EDEC;margin-top:6px;overflow:hidden"><div style="height:100%;width:{{b.pct}};background:#C24A50;border-radius:999px"></div></div>
            </div>
          </sc-for>
        </div>
        <h2 style="margin-top:22px">Dernières dépenses</h2>
        <div style="margin-top:6px">
          <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
            <div class="row">
              <div style="flex:1;min-width:0"><div style="font-weight:700">{{r.label}}</div><div class="muted">{{r.when}} · {{r.how}}</div></div>
              <div class="num" style="font-weight:800;color:#A51D24">−{{r.amountTxt}} F</div>
            </div>
          </sc-for>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      cat: 'elec', amountTxt: '', day: 'today', method: 'cash', saved: null,
      list: [
        { cat: 'loyer', amount: 120000, when: '1er octobre', how: 'Wave' },
        { cat: 'elec', amount: 35000, when: "Aujourd'hui", how: 'Espèces' },
        { cat: 'transport', amount: 15000, when: '3 octobre', how: 'Espèces' },
        { cat: 'salaire', amount: 50000, when: '2 octobre', how: 'Espèces' },
        { cat: 'phone', amount: 5000, when: '2 octobre', how: 'Orange Money' },
        { cat: 'eau', amount: 12500, when: '1er octobre', how: 'Wave' }
      ]
    };
  }
  renderVals() {
    const s = this.state;
    const set = (p) => this.setState(p);
    const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    const digits = (v) => String(v).replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 9);
    const defs = [
      ['loyer', 'Loyer', 'M3 10.5 12 3l9 7.5V20H3z'],
      ['elec', 'Électricité', 'M13 2 4 14h7l-1 8 9-12h-7z'],
      ['eau', 'Eau', 'M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z'],
      ['transport', 'Transport', 'M1 6h13v11H1zM14 10h5l4 4v3h-9z'],
      ['salaire', 'Salaires', 'M9 8a4 4 0 1 0 0-.01M2 21c0-4 3-6 7-6s7 2 7 6'],
      ['phone', 'Téléphone et internet', 'M7 2h10v20H7zM11 18h2'],
      ['repair', 'Réparations', 'M14 7l3-3 3 3-3 3M4 20l9-9'],
      ['tax', 'Taxes et impôts', 'M4 4h16v16H4zM8 9h8M8 13h8M8 17h5'],
      ['other', 'Autre', 'M5 12h.01M12 12h.01M19 12h.01']
    ];
    const name = {}; defs.forEach(([id, label]) => { name[id] = label; });
    const amount = parseInt(s.amountTxt, 10) || 0;
    const month = s.list.reduce((t, x) => t + x.amount, 0);
    const totals = {}; s.list.forEach((x) => { totals[x.cat] = (totals[x.cat] || 0) + x.amount; });
    const max = Math.max.apply(null, Object.keys(totals).map((k) => totals[k]));
    const byCat = Object.keys(totals).sort((a, b) => totals[b] - totals[a]).map((k) => ({ label: name[k], totalTxt: fmt(totals[k]), pct: Math.round(totals[k] / max * 100) + '%' }));
    const blocked = amount <= 0;
    const howName = { cash: 'Espèces', wave: 'Wave', om: 'Orange Money' };
    return {
      monthTxt: fmt(month), byCat: byCat,
      recent: s.list.slice(0, 5).map((x) => ({ label: name[x.cat], when: x.when, how: x.how, amountTxt: fmt(x.amount) })),
      cats: defs.map(([id, label, icon]) => ({ label: label, icon: icon, cls: s.cat === id ? 'on' : '', pick: () => set({ cat: id }) })),
      amountTxt: s.amountTxt, onAmount: (e) => set({ amountTxt: digits(e.target.value) }),
      keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', '000', '0', '⌫'].map((k) => ({
        label: k, aria: k === '⌫' ? 'Effacer un chiffre' : k,
        press: () => set({ amountTxt: k === '⌫' ? s.amountTxt.slice(0, -1) : digits(s.amountTxt + k) })
      })),
      days: [['today', "Aujourd'hui"], ['yesterday', 'Hier'], ['other', 'Autre jour']].map(([id, label]) => ({ label: label, cls: s.day === id ? 'on' : '', pick: () => set({ day: id }) })),
      methods: [['cash', 'Espèces'], ['wave', 'Wave'], ['om', 'Orange Money']].map(([id, label]) => ({ label: label, cls: s.method === id ? 'on' : '', pick: () => set({ method: id }) })),
      blocked: blocked, cta: blocked ? '#D9A9AB' : '#A51D24',
      save: () => {
        if (blocked) return;
        const when = s.day === 'today' ? "Aujourd'hui" : s.day === 'yesterday' ? 'Hier' : '30 septembre';
        set({ list: [{ cat: s.cat, amount: amount, when: when, how: howName[s.method] }].concat(s.list), amountTxt: '', saved: name[s.cat] + ' : ' + fmt(amount) + ' F enregistrés.' });
      },
      saved: Boolean(s.saved), savedTxt: s.saved || ''
    };
  }
}
</script>
</body>
</html>
