<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CoGes — Nouveau client ou fournisseur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FBF8F3;color:#1E2320;font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.45}
a{color:#117A3C}a:hover{color:#024A2C}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 24px;background:#FFFFFF;border-bottom:1px solid #ECE6DC}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:44px;height:44px;border-radius:14px;background:#117A3C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;text-decoration:none;color:#3C4440;font-weight:600;font-size:16px}
.tab:hover{background:#F3EEE5;color:#1E2320}
.tab.on{background:#F2ECFC;color:#5530A3}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:640px;margin:0 auto;padding:24px;box-sizing:border-box}
.card{background:#fff;border-radius:22px;border:1px solid #ECE6DC;padding:24px;box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;border-radius:18px;border:0;font:inherit;font-weight:700;font-size:18px;cursor:pointer;text-decoration:none}
.muted{color:#5B625E}
.num{font-variant-numeric:tabular-nums}
h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-0.01em}
.lbl{display:block;font-weight:700;font-size:17px;margin-bottom:8px}
.in{width:100%;box-sizing:border-box;min-height:58px;border-radius:16px;border:2px solid #E3DCD0;padding:0 16px;font:inherit;font-size:19px;background:#fff;color:#1E2320}
.in:focus{outline:3px solid #D5C6F5;border-color:#6D3FC8}
.seg{flex:1 1 200px;display:flex;align-items:center;justify-content:center;gap:12px;min-height:84px;border-radius:20px;border:2px solid #E3DCD0;background:#fff;font:inherit;font-weight:800;font-size:19px;color:#3C4440;cursor:pointer}
</style>
</helmet>
<div>
  <nav class="nav" aria-label="Menu principal">
    <div class="brand">
      <img src="../logo/coges-mark.png" alt="" style="width:40px;height:43px;flex:none">
      <div><img src="../logo/coges-wordmark.png" alt="CoGes" style="height:24px;width:102px;display:block"><div class="muted" style="font-size:15px">Alimentation Keur Fatou</div></div>
    </div>
    <div class="tabs">
      <a class="tab" href="Main.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
      <a class="tab" href="Vente.dc.html"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"></path></svg>Vendre</a>
      <a class="tab" href="Articles.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>Stock</a>
      <a class="tab on" href="Clients.dc.html"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"></path></svg>Clients</a>
      <a class="tab" href="Finance.dc.html"><svg class="ico" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="3"></rect><path d="M2 10h20M16 15h2"></path></svg>Argent</a>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <a class="tab" href="Conseils.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"></path></svg>Conseils</a>
      <a class="tab" href="Alertes.dc.html" aria-label="Alertes, 3 non lues" style="position:relative;padding:0 12px"><svg class="ico" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg><span style="position:absolute;top:4px;right:2px;min-width:20px;height:20px;border-radius:999px;background:#C2410C;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center">3</span></a>
      <a class="tab" href="Reglages.dc.html" aria-label="Réglages" style="padding:0 12px"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg></a>
    </div>
  </nav>

  <main class="wrap" style="display:flex;flex-direction:column;gap:20px">
    <h1>Ajouter une personne</h1>

    <div style="display:flex;flex-wrap:wrap;gap:12px" role="group" aria-label="Type de contact">
      <button type="button" class="seg" onClick="{{asClient}}" aria-pressed="{{isClient}}" style="border-color:{{clientBorder}};background:{{clientBg}};color:{{clientInk}}">
        <svg class="ico" viewBox="0 0 24 24" style="width:28px;height:28px"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>Un client
      </button>
      <button type="button" class="seg" onClick="{{asSupplier}}" aria-pressed="{{isSupplier}}" style="border-color:{{supBorder}};background:{{supBg}};color:{{supInk}}">
        <svg class="ico" viewBox="0 0 24 24" style="width:28px;height:28px"><path d="M1 6h13v11H1zM14 10h5l4 4v3h-9z"></path><circle cx="5.5" cy="18.5" r="1.8"></circle><circle cx="18.5" cy="18.5" r="1.8"></circle></svg>Un fournisseur
      </button>
    </div>

    <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
      <div class="card" style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:36px 24px">
        <div style="width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#fff;background:{{accent}}">{{initials}}</div>
        <h1 style="font-size:26px">{{name}}</h1>
        <div class="muted num" style="font-size:18px">{{phone}}</div>
        <div style="font-weight:700;font-size:18px;color:{{accentInk}}">{{savedLine}}</div>
        <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px">
          <button type="button" class="btn" onClick="{{again}}" style="background:{{accent}};color:#fff">Ajouter quelqu'un d'autre</button>
          <a class="btn" href="Vente.dc.html" style="background:#fff;color:#1E2320;border:2px solid #E3DCD0">Faire une vente</a>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
      <form class="card" style="display:flex;flex-direction:column;gap:22px">
        <div>
          <label class="lbl" for="cname">{{nameLabel}}</label>
          <input id="cname" class="in" value="{{name}}" onChange="{{onName}}" placeholder="{{namePh}}">
        </div>
        <div>
          <label class="lbl" for="cphone">Téléphone</label>
          <div style="display:flex;gap:8px">
            <div style="display:flex;align-items:center;padding:0 14px;border-radius:16px;background:#F3EEE5;font-weight:700;font-size:18px">+221</div>
            <input id="cphone" class="in num" inputmode="tel" value="{{phone}}" onChange="{{onPhone}}" placeholder="77 000 00 00">
          </div>
        </div>
        <button type="button" class="btn" onClick="{{save}}" style="width:100%;min-height:68px;font-size:21px;background:{{accent}};color:#fff">
          <svg class="ico" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M4 12.5 9.5 18 20 6"></path></svg>{{saveLabel}}
        </button>
      </form>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'client', name: 'Aminata Sow', phone: '77 655 90 21', saved: false };
  }
  renderVals() {
    const s = this.state;
    const set = (p) => this.setState(p);
    const client = s.kind === 'client';
    const accent = client ? '#6D3FC8' : '#1F5BD8';
    const initials = s.name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w.charAt(0).toUpperCase()).join('') || '?';
    return {
      isClient: client, isSupplier: !client,
      clientBorder: client ? '#6D3FC8' : '#E3DCD0', clientBg: client ? '#F2ECFC' : '#fff', clientInk: client ? '#5530A3' : '#3C4440',
      supBorder: !client ? '#1F5BD8' : '#E3DCD0', supBg: !client ? '#EAF1FD' : '#fff', supInk: !client ? '#1747AE' : '#3C4440',
      asClient: () => set({ kind: 'client', saved: false }),
      asSupplier: () => set({ kind: 'supplier', saved: false }),
      nameLabel: client ? 'Nom du client' : 'Nom du fournisseur',
      namePh: client ? 'Ex. Aminata Sow' : 'Ex. Grossiste Sandaga',
      saveLabel: client ? 'Enregistrer le client' : 'Enregistrer le fournisseur',
      savedLine: client ? 'Client ajouté : vous pouvez lui vendre à crédit' : 'Fournisseur ajouté',
      accent: accent, accentInk: client ? '#5530A3' : '#1747AE',
      name: s.name, phone: s.phone, initials: initials,
      onName: (e) => set({ name: e.target.value }),
      onPhone: (e) => set({ phone: e.target.value }),
      save: () => set({ saved: true }), saved: s.saved, editing: !s.saved,
      again: () => set({ name: '', phone: '', saved: false })
    };
  }
}
</script>
</body>
</html>
