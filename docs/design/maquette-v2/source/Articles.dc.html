<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CoGes — Stock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FBF8F3;color:#1E2320;font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.45}
a{color:#117A3C}a:hover{color:#024A2C}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 24px;background:#FFFFFF;border-bottom:1px solid #ECE6DC}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:44px;height:44px;border-radius:14px;background:#117A3C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;text-decoration:none;color:#3C4440;font-weight:600;font-size:16px}
.tab:hover{background:#F3EEE5;color:#1E2320}
.tab.on{background:#FFF0E3;color:#9A3412}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:24px 24px 48px;box-sizing:border-box}
.card{background:#fff;border-radius:22px;border:1px solid #ECE6DC;padding:20px;box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;font:inherit;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:#5B625E}
h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-0.01em}
.chip{min-height:48px;padding:0 18px;border-radius:999px;border:2px solid #E3DCD0;background:#fff;font:inherit;font-weight:600;font-size:16px;color:#1E2320;cursor:pointer}
.chip.on{border-color:#C2410C;background:#C2410C;color:#fff}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 14px;border-radius:18px;text-decoration:none;color:#1E2320;min-height:72px}
.prow:hover{background:#F6F2EB;color:#1E2320}
.sq{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#fff;flex:none}
.bar{height:10px;border-radius:999px;background:#F0EBE2;overflow:hidden;width:140px}
input.search{width:100%;box-sizing:border-box;min-height:56px;border-radius:16px;border:2px solid #E3DCD0;padding:0 16px 0 48px;font:inherit;font-size:17px;background:#fff;color:#1E2320}
input.search:focus{outline:3px solid #FCC9A3;border-color:#C2410C}
</style>
</helmet>
<div>
  <nav class="nav" aria-label="Menu principal">
    <div class="brand">
      <img src="../logo/coges-mark.png" alt="" style="width:40px;height:43px;flex:none">
      <div><img src="../logo/coges-wordmark.png" alt="CoGes" style="height:24px;width:102px;display:block"><div class="muted" style="font-size:15px">Alimentation Keur Fatou</div></div>
    </div>
    <div class="tabs">
      <a class="tab" href="Main.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
      <a class="tab" href="Vente.dc.html"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"></path></svg>Vendre</a>
      <a class="tab on" href="Articles.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>Stock</a>
      <a class="tab" href="Clients.dc.html"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"></path></svg>Clients</a>
      <a class="tab" href="Finance.dc.html"><svg class="ico" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="3"></rect><path d="M2 10h20M16 15h2"></path></svg>Argent</a>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <a class="tab" href="Conseils.dc.html"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"></path></svg>Conseils</a>
      <a class="tab" href="Alertes.dc.html" aria-label="Alertes, 3 non lues" style="position:relative;padding:0 12px"><svg class="ico" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg><span style="position:absolute;top:4px;right:2px;min-width:20px;height:20px;border-radius:999px;background:#C2410C;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center">3</span></a>
      <a class="tab" href="Reglages.dc.html" aria-label="Réglages" style="padding:0 12px"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg></a>
    </div>
  </nav>

  <main class="wrap" style="display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
      <div>
        <h1>Stock</h1>
        <div class="muted" style="font-size:18px">46 articles · votre stock vaut <span class="num" style="font-weight:800;color:#9A3412">1 845 000 F</span> au prix d'achat</div>
      </div>
      <a class="btn" href="Produit.dc.html" style="background:#C2410C;color:#fff;min-height:60px;font-size:19px">
        <svg class="ico" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M12 5v14M5 12h14"></path></svg>Nouvel article
      </a>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
      <a href="Livraison.dc.html" class="card" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#1E2320;min-height:80px">
        <svg class="ico" viewBox="0 0 24 24" style="width:30px;height:30px;color:#C2410C"><path d="M1 6h13v11H1zM14 10h5l4 4v3h-9z"></path><circle cx="5.5" cy="18.5" r="1.8"></circle><circle cx="18.5" cy="18.5" r="1.8"></circle></svg>
        <span style="font-weight:700;font-size:17px">Recevoir une livraison</span>
      </a>
      <a href="Stock.dc.html" class="card" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#1E2320;min-height:80px">
        <svg class="ico" viewBox="0 0 24 24" style="width:30px;height:30px;color:#C2410C"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
        <span style="font-weight:700;font-size:17px">Corriger le stock</span>
      </a>
      <a href="Rayons.dc.html" class="card" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#1E2320;min-height:80px">
        <svg class="ico" viewBox="0 0 24 24" style="width:30px;height:30px;color:#C2410C"><path d="M3 5h18M3 12h18M3 19h18"></path></svg>
        <span style="font-weight:700;font-size:17px">Gérer les rayons</span>
      </a>
    </div>

    <div style="position:relative">
      <svg class="ico" viewBox="0 0 24 24" style="position:absolute;left:16px;top:17px;color:#5B625E"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <label for="qa" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Chercher un article</label>
      <input id="qa" class="search" type="search" placeholder="Chercher un article ou scanner son code" value="{{q}}" onChange="{{onSearch}}">
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" class="chip {{f.cls}}" onClick="{{f.pick}}">{{f.label}}</button>
      </sc-for>
    </div>

    <section class="card" style="padding:10px">
      <sc-for list="{{rows}}" as="p" hint-placeholder-count="8">
        <a class="prow" href="ArticleFiche.dc.html">
          <div class="sq" style="background:{{p.color}}">{{p.initial}}</div>
          <div style="flex:1 1 220px;min-width:0">
            <div style="font-weight:700;font-size:17px">{{p.name}}</div>
            <div class="muted">{{p.cat}} · vendu {{p.priceTxt}} F</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:150px">
            <span style="font-weight:800;font-size:17px;color:{{p.ink}}">{{p.stockTxt}}</span>
            <div class="bar"><div style="height:100%;width:{{p.pct}};background:{{p.barColor}};border-radius:999px"></div></div>
          </div>
        </a>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'all', q: '' };
  }
  renderVals() {
    const s = this.state;
    const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    const items = [
      { name: 'Riz brisé 25 kg', cat: 'Céréales', price: 15500, stock: 2, alert: 3, unit: 'sacs', color: '#B45309', full: 20 },
      { name: 'Huile Dinor 1 L', cat: 'Huiles', price: 1400, stock: 4, alert: 5, unit: 'bouteilles', color: '#CA8A04', full: 40 },
      { name: 'Sucre en morceaux 1 kg', cat: 'Épicerie', price: 900, stock: 3, alert: 5, unit: 'paquets', color: '#0E7490', full: 30 },
      { name: 'Lait en poudre 500 g', cat: 'Épicerie', price: 3200, stock: 0, alert: 4, unit: 'boîtes', color: '#1D4ED8', full: 12 },
      { name: 'Lait Vitalait 400 g', cat: 'Épicerie', price: 2600, stock: 18, alert: 6, unit: 'boîtes', color: '#1F5BD8', full: 24 },
      { name: 'Café Touba 250 g', cat: 'Boissons', price: 1000, stock: 25, alert: 8, unit: 'sachets', color: '#7C2D12', full: 40 },
      { name: 'Savon Madar', cat: 'Hygiène', price: 300, stock: 60, alert: 10, unit: 'pièces', color: '#6D3FC8', full: 80 },
      { name: 'Thé Lipton 25 sachets', cat: 'Boissons', price: 1250, stock: 14, alert: 5, unit: 'boîtes', color: '#B91C1C', full: 24 },
      { name: 'Eau Kirène 1,5 L', cat: 'Boissons', price: 400, stock: 48, alert: 12, unit: 'bouteilles', color: '#0369A1', full: 60 }
    ];
    const q = s.q.trim().toLowerCase();
    const state = (p) => p.stock === 0 ? 'out' : p.stock <= p.alert ? 'low' : 'ok';
    const rows = items
      .filter((p) => (s.f === 'all' || state(p) === s.f || p.cat === s.f) && (!q || p.name.toLowerCase().indexOf(q) >= 0))
      .sort((a, b) => ({ out: 0, low: 1, ok: 2 })[state(a)] - ({ out: 0, low: 1, ok: 2 })[state(b)])
      .map((p) => {
        const st = state(p);
        return {
          name: p.name, cat: p.cat, priceTxt: fmt(p.price), color: p.color, initial: p.name.charAt(0),
          stockTxt: st === 'out' ? 'Épuisé' : (st === 'low' ? 'Plus que ' : '') + p.stock + ' ' + p.unit,
          ink: st === 'ok' ? '#1E2320' : st === 'low' ? '#9A3412' : '#A51D24',
          barColor: st === 'ok' ? '#117A3C' : st === 'low' ? '#E8833A' : '#A51D24',
          pct: Math.max(st === 'out' ? 0 : 6, Math.round((p.stock / p.full) * 100)) + '%'
        };
      });
    const filters = [['all', 'Tous'], ['low', 'Bientôt épuisés (3)'], ['out', 'Épuisés (1)'], ['Céréales', 'Céréales'], ['Boissons', 'Boissons'], ['Épicerie', 'Épicerie'], ['Hygiène', 'Hygiène']].map(([id, label]) => ({
      label: label, cls: s.f === id ? 'on' : '', pick: () => this.setState({ f: id })
    }));
    return { rows: rows, filters: filters, q: s.q, onSearch: (e) => this.setState({ q: e.target.value }) };
  }
}
</script>
</body>
</html>
