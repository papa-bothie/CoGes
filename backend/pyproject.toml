[project]
name = "coges-backend"
version = "0.1.0"
description = "CoGes — gestion PME ouest-africaines (API FastAPI + workers Celery)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.15",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "sentry-sdk[celery,fastapi]>=2.19",
    "openpyxl>=3.1",
    "python-multipart>=0.0.20",
    "defusedxml>=0.7",
    # Importés directement par app/ : déclarés ici, pas seulement reçus par fastapi ou
    # celery (tests/architecture/test_runtime_dependencies.py). httpx sert à l'API
    # (clés de Cloudflare Access, ADR 0104), pas seulement aux tests.
    "httpx>=0.28",
    "anyio>=4.15",
    "starlette>=1.7",
    "kombu>=5.6",
    # QR code d'enrôlement de la double authentification de l'administration (ADR 0105) :
    # Python pur, sans dépendance, version figée.
    "segno==1.6.6",
    # Chiffrement des secrets TOTP (AES-GCM, HKDF) ; déjà reçu par pyjwt[crypto].
    "cryptography>=46",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-openpyxl>=3.1.5.20260827",
    "honcho>=2.0.0",
]
# CoGes Intelligence (phase 09, ADR 0035) : réservé à l'image worker. L'API ne lit
# que `forecasts` et `insights` et n'importe jamais ces bibliothèques.
ml = [
    "numpy>=2.1",
    "pandas>=2.2",
    "statsmodels>=0.14.4",
]

[tool.uv]
package = false
default-groups = ["dev", "ml"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Tables du jeu de démonstration : une ligne par article, plus lisible qu'un éclatement.
"app/seed.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

# statsmodels ne publie pas de stubs ; pandas est typé via pandas-stubs absent en V1.
[[tool.mypy.overrides]]
module = ["statsmodels.*", "pandas.*"]
ignore_missing_imports = true

# Celery et kombu ne publient ni stubs ni marqueur py.typed.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

# `@celery_app.task` vient d'une bibliothèque non typée : sous --strict, il rend
# « non typée » toute fonction qu'il décore. Seule cette vérification-là est levée,
# et seulement sur les modules de tâches — le corps des tâches reste intégralement
# vérifié, comme le reste de `app/`.
[[tool.mypy.overrides]]
module = ["app.workers.tasks.*", "app.workers.celery_app"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not perf"` : la mesure de latence sème une entreprise entière et coûte une
# dizaine de secondes. Elle a sa cible, `make test-perf`, et son étape de CI.
addopts = "-q --strict-markers -m 'not perf'"
markers = [
    "tenancy: tests de fuite inter-tenant (bloquants en CI)",
    "integration: tests nécessitant PostgreSQL et Redis",
    "perf: mesure de latence sur un jeu de démonstration (hors suite par défaut)",
]
