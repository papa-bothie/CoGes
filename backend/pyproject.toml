[project]
name = "coges-backend"
version = "0.1.0"
description = "CoGes — gestion PME ouest-africaines (API FastAPI + workers Celery)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "celery[redis]>=5.4",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.16.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

# Celery ne publie ni stubs ni marqueur py.typed.
[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

# `@celery_app.task` vient d'une bibliothèque non typée : sous --strict, il rend
# « non typée » toute fonction qu'il décore. Seule cette vérification-là est levée,
# et seulement sur les modules de tâches — le corps des tâches reste intégralement
# vérifié, comme le reste de `app/`.
[[tool.mypy.overrides]]
module = "app.workers.tasks.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not perf"` : la mesure de latence sème une entreprise entière et coûte une
# dizaine de secondes. Elle a sa cible, `make test-perf`, et son étape de CI.
addopts = "-q --strict-markers -m 'not perf'"
markers = [
    "tenancy: tests de fuite inter-tenant (bloquants en CI)",
    "integration: tests nécessitant PostgreSQL et Redis",
    "perf: mesure de latence sur un jeu de démonstration (hors suite par défaut)",
]
