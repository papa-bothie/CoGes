# Infrastructure de développement local : PostgreSQL 18 et Redis 7.
# En production, ces deux services sont managés (zone B du Diagramme 2).
# PostgreSQL suit la version majeure de la production Neon (ADR 0095).

services:
  postgres:
    image: postgres:18-alpine
    container_name: coges-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: postgres
      COGES_OWNER_PASSWORD: ${COGES_OWNER_PASSWORD:?définir COGES_OWNER_PASSWORD dans .env}
      COGES_APP_PASSWORD: ${COGES_APP_PASSWORD:?définir COGES_APP_PASSWORD dans .env}
      COGES_RELAY_PASSWORD: ${COGES_RELAY_PASSWORD:?définir COGES_RELAY_PASSWORD dans .env}
      COGES_ANALYTICS_PASSWORD: ${COGES_ANALYTICS_PASSWORD:?définir COGES_ANALYTICS_PASSWORD dans .env}
      COGES_PLATFORM_PASSWORD: ${COGES_PLATFORM_PASSWORD:-change-me-platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # L'image 18 range ses données sous /var/lib/postgresql/18/docker : le volume se
      # monte sur /var/lib/postgresql (et non plus …/data). Nouveau volume : un volume
      # de données 16 ne démarre pas sous 18. `make db-upgrade-18` y recopie l'ancien.
      - coges_pgdata18:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coges"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: coges-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - coges_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Ancien volume PostgreSQL 16, conservé tel quel (jamais supprimé par CoGes) : il est
  # relu par `make db-upgrade-18`. Après vérification, `docker volume rm
  # coges_coges_pgdata` le libère.
  # coges_pgdata:
  coges_pgdata18:
  coges_redisdata:
