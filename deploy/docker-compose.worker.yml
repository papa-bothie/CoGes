# Workers CoGes en production (zone B). Squelette de phase 00 : complété en phase 08
# (tâches Celery, beat) puis durci en phase 10 (déploiement).
#
# Usage : docker compose -f deploy/docker-compose.worker.yml up -d
# Les variables viennent de l'environnement de l'hôte, jamais d'un fichier versionné.

services:
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    image: coges/worker:dev
    restart: unless-stopped
    environment:
      COGES_ENV: ${COGES_ENV:?}
      COGES_DATABASE_URL_APP: ${COGES_DATABASE_URL_APP:?}
      COGES_REDIS_URL: ${COGES_REDIS_URL:?}
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]

  beat:
    image: coges/worker:dev
    restart: unless-stopped
    depends_on: [worker]
    environment:
      COGES_ENV: ${COGES_ENV:?}
      COGES_DATABASE_URL_APP: ${COGES_DATABASE_URL_APP:?}
      COGES_REDIS_URL: ${COGES_REDIS_URL:?}
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
